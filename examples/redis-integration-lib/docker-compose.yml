version: '3.8'
name: 'redis-integration-lib'

services:
  # PostgreSQL database (required for Electric)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: electric
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '54321:5432'
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical

  # Electric sync service
  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/electric
      ELECTRIC_INSECURE: 'true'
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  # Redis (node-redis compatible)
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # Valkey (Redis fork, iovalkey compatible)
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6389:6379'
