[package]
name = "electric-client"
version = "0.1.0"
edition = "2021"
description = "Async Rust client for the Electric SQL sync service"
license = "Apache-2.0"
repository = "https://github.com/electric-sql/electric"
keywords = ["electric", "postgres", "sync", "realtime", "local-first"]
categories = ["database", "network-programming", "asynchronous"]

[features]
default = []
# Enable to compile and run integration tests that require a running Electric + Postgres instance
integration = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
url = "2"
async-trait = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# tokio-postgres is always available in dev; the integration test binary is only
# *compiled* when --features integration is passed (see [[test]] below).
tokio-postgres = "0.7"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration"]
